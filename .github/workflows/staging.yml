name: Deploy Staging

on:
  push:
    branches:
      - Development

jobs:
  deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari branch Development
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup PHP 8.3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, curl, zip, xml, gd, bcmath
          tools: composer:v2
          coverage: none

      # 3. Install dependency Laravel
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 5. Install frontend dependencies
      - name: Install NPM dependencies
        run: npm ci

      # 6. Build Vite
      - name: Build frontend
        run: npm run build

      # 7. Deploy via FTP
      - name: Deploy to staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/storage/**
            **/public/storage/**
            **/node_modules/**
